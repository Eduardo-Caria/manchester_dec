name: gds

on:
  push:
  workflow_dispatch:

jobs:
  wokwi_project:
    name: Check Wokwi project ID
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - id: config
        shell: bash
        run: |
          wokwi_id="$(awk '$1 == "wokwi_id:" { print $2; exit }' info.yaml)"
          if [[ "$wokwi_id" == 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Save the receiver-only Wokwi project and set project.wokwi_id in info.yaml to start a build." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$wokwi_id" =~ ^[1-9][0-9]+$ ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=info.yaml::Expected a numeric Wokwi project ID"
            exit 1
          fi

  gds:
    needs: wokwi_project
    if: ${{ needs.wokwi_project.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A
      - name: Check schematic used for the GDS build
        run: python3 scripts/check_diagram.py diagram.json --built-diagram src/wokwi_diagram.json

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
      - name: Test the powered gate-level netlist
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
